name: macOS Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0.0

permissions:
  contents: write # Required for creating releases

jobs:
  build-and-release:
    name: Build and Release
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project ClipTyper.xcodeproj -scheme ClipTyper

      - name: Build Application
        run: |
          xcodebuild clean build \
            -project ClipTyper.xcodeproj \
            -scheme ClipTyper \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            CONFIGURATION_BUILD_DIR=${{ github.workspace }}/build

      - name: Package to ZIP
        run: |
          cd ${{ github.workspace }}/build
          zip -r ClipTyper-${{ github.ref_name }}.zip ClipTyper.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/ClipTyper-${{ github.ref_name }}.zip
          name: Release ${{ github.ref_name }}
          draft: true # Set to true per recommendation to allow manual editing of notes
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
