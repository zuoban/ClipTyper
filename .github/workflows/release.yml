name: macOS Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build and Test
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache SPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project ClipTyper.xcodeproj -scheme ClipTyper

      - name: Build Application
        run: |
          xcodebuild clean build \
            -project ClipTyper.xcodeproj \
            -scheme ClipTyper \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            CONFIGURATION_BUILD_DIR=${{ github.workspace }}/build

      - name: Run Tests
        run: |
          xcodebuild test \
            -project ClipTyper.xcodeproj \
            -scheme ClipTyper \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipTyper-app
          path: build/ClipTyper.app

  release:
    name: Package and Release
    needs: build
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ClipTyper-app
          path: build

      - name: Package to DMG
        run: |
          brew install create-dmg
          mkdir -p dist
          mkdir -p staging
          cp -R build/ClipTyper.app staging/
          create-dmg \
            --volname "ClipTyper" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "ClipTyper.app" 175 120 \
            --hide-extension "ClipTyper.app" \
            --app-drop-link 425 120 \
            "dist/ClipTyper-${{ github.ref_name }}.dmg" \
            "staging/"

      - name: Code Sign DMG (optional)
        if: ${{ env.DEVELOPER_ID_CERTIFICATE_BASE64 != '' }}
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          echo "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 -d > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          codesign --force --options runtime --sign "Developer ID Application" "dist/ClipTyper-${{ github.ref_name }}.dmg"

      - name: Notarize DMG
        if: ${{ env.APPLE_ID != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "dist/ClipTyper-${{ github.ref_name }}.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "dist/ClipTyper-${{ github.ref_name }}.dmg"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClipTyper-${{ github.ref_name }}.dmg
          name: Release ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
