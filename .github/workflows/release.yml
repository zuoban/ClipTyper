name: macOS Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0.0

permissions:
  contents: write # Required for creating releases

jobs:
  build-and-release:
    name: Build and Release
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project ClipTyper.xcodeproj -scheme ClipTyper

      - name: Build Application
        run: |
          xcodebuild clean build \
            -project ClipTyper.xcodeproj \
            -scheme ClipTyper \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            CONFIGURATION_BUILD_DIR=${{ github.workspace }}/build

      - name: Package to DMG
        run: |
          brew install create-dmg
          mkdir -p dist
          mkdir -p staging
          # Only copy the .app bundle to staging
          cp -R build/ClipTyper.app staging/
          create-dmg \
            --volname "ClipTyper" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "ClipTyper.app" 175 120 \
            --hide-extension "ClipTyper.app" \
            --app-drop-link 425 120 \
            "dist/ClipTyper-${{ github.ref_name }}.dmg" \
            "staging/"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClipTyper-${{ github.ref_name }}.dmg
          name: Release ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
